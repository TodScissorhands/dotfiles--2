[main]
include=/home/tod/.cache/wal/fuzzel.ini
font=GeistMono Nerd Font Mono:size=10
use-bold=no
dpi-aware=no
prompt="❯ "
placeholder="navigate..."
anchor=top-left
x-margin=10
y-margin=33
lines=9
width=70
horizontal-pad=10
vertical-pad=6
inner-pad=4
line-height=20
image-size-ratio=0
icons-enabled=yes
layer=overlay
exit-on-keyboard-focus-loss=yes

[border]
width=2
radius=0
selection-radius=0
